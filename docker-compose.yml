# Local development.
#   docker compose up app                    dev server on http://localhost:3417
#   docker compose --profile e2e run --rm e2e   Playwright tests (from phase 5; needs `npm run build` setup)
# Supabase runs separately through the Supabase CLI (npm run db:start, phase 2).
services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3417:3417"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"

  e2e:
    profiles: ["e2e"]
    # Keep this tag in step with the @playwright/test version (added in the e2e phase).
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /app
    ipc: host
    command: sh -c "npm ci && npm run test:e2e"
    env_file:
      - path: .env.local
        required: false
    environment:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  app_node_modules:
  app_next:
  e2e_node_modules:
